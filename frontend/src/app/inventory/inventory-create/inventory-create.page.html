
<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-button (click)="goBack()">
        <ion-icon
          slot="icon-only"
          name="arrow-back-outline">
        </ion-icon>
      </ion-button>
    </ion-buttons>

    <ion-title>Add New Product</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="form-container">

    <div class="page-heading">
      <div class="heading-icon">
        <ion-icon name="cube-outline"></ion-icon>
      </div>
      <div>
        <h1>New Optical Product</h1>
        <p>Enter the product information and initial stock.</p>
      </div>
    </div>

    <ion-card>
      <ion-card-content>

        <form (ngSubmit)="saveProduct()">

          <h2>Product Information</h2>

          <div class="form-grid">

            <ion-input
              class="full-width"
              label="Product Name *"
              labelPlacement="stacked"
              fill="outline"
              placeholder="e.g. Classic Black Eyeglass Frame"
              name="productName"
              [(ngModel)]="productName"
              [disabled]="saving()"
              required>
            </ion-input>

            <ion-select
              label="Category *"
              labelPlacement="stacked"
              fill="outline"
              interface="popover"
              placeholder="Select category"
              name="category"
              [(ngModel)]="category"
              [disabled]="saving()"
              required>

              <ion-select-option
                *ngFor="let item of categories"
                [value]="item">
                {{ item }}
              </ion-select-option>

            </ion-select>

            <ion-input
              label="Brand"
              labelPlacement="stacked"
              fill="outline"
              placeholder="e.g. Optimum Vision"
              name="brand"
              [(ngModel)]="brand"
              [disabled]="saving()">
            </ion-input>

            <ion-input
              label="SKU"
              labelPlacement="stacked"
              fill="outline"
              placeholder="e.g. OV-FRAME-002"
              name="sku"
              [(ngModel)]="sku"
              [disabled]="saving()">
            </ion-input>

            <ion-input
              label="Price (PHP) *"
              labelPlacement="stacked"
              fill="outline"
              type="number"
              min="0"
              step="0.01"
              placeholder="0.00"
              name="price"
              [(ngModel)]="price"
              [disabled]="saving()"
              required>
            </ion-input>

            <ion-input
              label="Initial Stock"
              labelPlacement="stacked"
              fill="outline"
              type="number"
              min="0"
              step="1"
              name="initialStock"
              [(ngModel)]="initialStock"
              [disabled]="saving()">
            </ion-input>

            <ion-input
              label="Low Stock Threshold"
              labelPlacement="stacked"
              fill="outline"
              type="number"
              min="0"
              step="1"
              name="lowStockThreshold"
              [(ngModel)]="lowStockThreshold"
              [disabled]="saving()">
            </ion-input>

            <ion-textarea
              class="full-width"
              label="Description"
              labelPlacement="stacked"
              fill="outline"
              placeholder="Enter product description"
              name="description"
              [(ngModel)]="description"
              [autoGrow]="true"
              [disabled]="saving()">
            </ion-textarea>

          </div>

          <ion-note>
            Fields marked with * are required.
          </ion-note>

          <div
            class="message error-message"
            *ngIf="errorMessage()">
            {{ errorMessage() }}
          </div>

          <div
            class="message success-message"
            *ngIf="successMessage()">
            {{ successMessage() }}
          </div>

          <div class="form-actions">

            <ion-button
              type="button"
              fill="outline"
              color="medium"
              [disabled]="saving()"
              (click)="goBack()">
              Cancel
            </ion-button>

            <ion-button
              type="submit"
              [disabled]="saving()">

              <ion-spinner
                *ngIf="saving()"
                name="crescent">
              </ion-spinner>

              <ion-icon
                *ngIf="!saving()"
                slot="start"
                name="save-outline">
              </ion-icon>

              {{ saving() ? 'Saving...' : 'Save Product' }}
            </ion-button>

          </div>

        </form>

      </ion-card-content>
    </ion-card>

  </div>
</ion-content>
